name: Feature request
description: Suggest a capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can you not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: grounding
    attributes:
      label: Effect on grounding
      description: |
        Does this change what the system will assert, or what a citation means?
        If so, say how it stays checkable.
