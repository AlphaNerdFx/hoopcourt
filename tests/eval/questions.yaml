# Labelled evaluation set for retrieval and routing.
#
# The PRD promises "zero hallucinations across 95% of test scenarios" and "100%
# correct matching of queries to their respective historical rulesets" while
# defining zero scenarios. This file is those scenarios. It is written BEFORE
# retrieval tuning on purpose: a metric invented after the fact measures the
# implementation, not the requirement.
#
# Every field is checkable WITHOUT an LLM, so the whole suite runs offline, free,
# and on CPU:
#   expect_route      routing decision (src/api/router.py)
#   expect_year       season the query must resolve to
#   expect_documents  retrieved chunks must come from these
#   forbid_documents  rule-bleeding check: NO chunk may come from these
#   expect_terms_any  recall proxy: >=1 retrieved chunk contains one of these
#
# categories: temporal_isolation | grounded_citation | refusal | trigger_routing

questions:

# ---------------------------------------------------------------- temporal
# The same question, asked of different eras, must reach different rulesets.
- id: max-salary-2024
  category: temporal_isolation
  question: "What was the maximum annual salary a player could receive in 2024?"
  clarified_season: "2024-25"   # boundary year: two seasons, different documents
  expect_route: strict_season_filter
  expect_year: 2024
  expect_documents: ["2023 NBA CBA", "NBA Constitution 2024", "2024-25 CBA 101",
                     "NBA Uniform Player Contract", "NBPA Agents Governing Regulations"]
  forbid_documents: ["CBA 2011", "CBA 2017", "CBA 2005", "NBPA CBA 1999", "CBA 1995"]
  expect_terms_any: ["Maximum Annual Salary", "thirty-five percent", "Salary Cap"]

