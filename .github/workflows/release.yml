name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify release meets build standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src scripts tests

      - name: Tests
        run: pytest tests/ -q

      - name: Version matches the tag
        env:
          # Read through the environment, never interpolated into `run:`. A
          # ${{ }} expression is substituted as text before the shell parses the
          # line, so a workflow_dispatch tag containing shell metacharacters is
          # executed rather than compared. Gated on write access, so this is
          # defence in depth, not a live hole.
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${GITHUB_REF_NAME:-$INPUT_TAG}"
          VERSION="${TAG#v}"
          grep -q "^## \[${VERSION}\]" CHANGELOG.md \
            || { echo "CHANGELOG.md has no section for ${VERSION}"; exit 1; }
          echo "changelog section found for ${VERSION}"

      - name: Build a public-domain index and run the evaluation
        # Court opinions and the curated timeline are the only sources that can
        # legally be fetched in CI, and they are exactly what covers pre-1995.
        #
        # --tier, not a generated list of --only flags. doc_name carries spaces
        # and parentheses ("Haywood v. NBA (U.S. 1971)"), and quotes produced
        # inside a command substitution are not re-parsed by the shell, so the
        # name word split into unrecognised arguments and this job had never
        # once succeeded. A tier is a single token and cannot split.
        run: |
          python scripts/fetch_opinions.py
          python scripts/build_index.py --db ci.db --tier judicial
          # The whole suite, not one category: temporal isolation is the gate
          # (docs/project/VERSIONING.md). Questions whose documents are absent
          # from this public-domain index are skipped rather than failed.
          python tests/eval/run_eval.py --db ci.db

  publish:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract this version's changelog section
        id: notes
        env:
          # Read through the environment, never interpolated into `run:`. A
          # ${{ }} expression is substituted as text before the shell parses the
          # line, so a workflow_dispatch tag containing shell metacharacters is
          # executed rather than compared. Gated on write access, so this is
          # defence in depth, not a live hole.
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${GITHUB_REF_NAME:-$INPUT_TAG}"
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "--- release notes ---"; cat RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          # Any 0.x tag, and any tag carrying a pre-release suffix such as
          # v1.0.0-rc.1. Release candidates exist because part of the gate is
          # manual: CI has no GPU and no corpus. See docs/project/TESTING.md.
          prerelease: ${{ startsWith(steps.notes.outputs.tag, 'v0.') || contains(steps.notes.outputs.tag, '-') }}
