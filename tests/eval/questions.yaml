- id: trigger-ambiguous-2011-boundary
  category: trigger_routing
  # 2010-11 is governed by CBA 2005 and 2011-12 by CBA 2011, so "2011" is exactly
  # as ambiguous as "2023". The spec flagged only 2023; the set is now derived
  # from the corpus so every document boundary is guarded.
  question: "What was the luxury tax in 2011?"
  expect_route: require_season_clarification
  expect_year: 2011
  expect_trigger: null

